name: phase0-lab-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lab:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test
